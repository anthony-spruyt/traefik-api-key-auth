# yaml-language-server: $schema=https://golangci-lint.run/jsonschema/golangci.jsonschema.json
# This file is automatically updated - do not modify directly

version: "2"
linters:
  default: "none"
  enable:
    - "errcheck"
    - "gocritic"
    - "govet"
    - "ineffassign"
    - "staticcheck"
    - "unused"
    - "depguard"
  exclusions:
    generated: "lax"
    presets:
      - "comments"
      - "common-false-positives"
      - "legacy"
      - "std-error-handling"
  settings:
    depguard:
      rules:
        yaegi:
          deny:
            - pkg: "unsafe"
              desc: "Traefik's Yaegi interpreter does not allow unsafe"
            - pkg: "syscall"
              desc: "Traefik's Yaegi interpreter does not allow syscall"
formatters:
  enable:
    - "gofmt"
    - "goimports"
  settings:
    goimports:
      local-prefixes:
        - "github.com/anthony-spruyt/traefik-api-key-auth"
